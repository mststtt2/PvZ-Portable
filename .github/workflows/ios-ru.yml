name: Build (ru, iOS + Windows)

on:
  push:
    branches: [ "ru-strings" ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build for iOS (arm64)
    runs-on: macos-15-intel  # arm64 macOS runners are often unavailable; Intel Xcode builds iOS arm64 just as well
    env:
      IOS_DEPLOY_TARGET: "16.4"
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - name: Get toolchain ID for cache key
      run: |
        CLANG_VER=$(clang --version | head -1 | sed -nE 's/.*version ([0-9.]+).*/\1/p')
        echo "VCPKG_TC=clang-${CLANG_VER:-unknown}" >> "$GITHUB_ENV"

    - name: Restore vcpkg binary cache
      uses: actions/cache@v6
      with:
        path: vcpkg-cache
        key: vcpkg-ios-${{ env.VCPKG_TC }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'CMake/triplets/arm64-ios.cmake') }}
        restore-keys: |
          vcpkg-ios-${{ env.VCPKG_TC }}-
          vcpkg-ios-

    - name: Setup vcpkg
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: vcpkg.json

    - name: Build PvZ-Portable for iOS
      run: |
        BUILD_DIR=build-ios
        cmake -B $BUILD_DIR \
          -DCMAKE_TOOLCHAIN_FILE=$VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake \
          -DVCPKG_OVERLAY_TRIPLETS=$GITHUB_WORKSPACE/CMake/triplets \
          -DVCPKG_TARGET_TRIPLET=arm64-ios \
          -DCMAKE_SYSTEM_NAME=iOS \
          -DCMAKE_OSX_DEPLOYMENT_TARGET=$IOS_DEPLOY_TARGET \
          -DCMAKE_OSX_ARCHITECTURES=arm64 \
          -DCMAKE_BUILD_TYPE=Release \
          -G Xcode
        cmake --build $BUILD_DIR --config Release -- \
          -sdk iphoneos \
          CODE_SIGN_IDENTITY="-" \
          CODE_SIGNING_ALLOWED=NO

    - name: Create unsigned IPA
      run: |
        APP_PATH=$(find build-ios -name "pvz-portable.app" -path "*Release*" | head -1)
        mkdir -p dist/Payload
        cp -R "$APP_PATH" dist/Payload/
        cd dist
        zip -r -y pvz-portable-ios-arm64-ru.ipa Payload/
        rm -rf Payload

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: pvz-portable-ios-ru
        path: dist/

  build-windows:
    name: Build for Windows (MSVC x64)
    runs-on: windows-latest
    env:
      VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/vcpkg-cache,readwrite
    steps:
    - uses: actions/checkout@v6
      with:
        fetch-depth: 0

    - uses: ilammy/msvc-dev-cmd@v1

    - name: Get toolchain ID for cache key
      shell: pwsh
      run: |
        $tc = $env:VCToolsVersion
        if (-not $tc) { $tc = "unknown" }
        echo "VCPKG_TC=msvc-$tc" >> $env:GITHUB_ENV

    - name: Restore vcpkg binary cache
      uses: actions/cache@v6
      with:
        path: vcpkg-cache
        key: vcpkg-windows-x64-${{ env.VCPKG_TC }}-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
        restore-keys: |
          vcpkg-windows-x64-${{ env.VCPKG_TC }}-
          vcpkg-windows-x64-

    - name: Install Ninja
      run: choco install ninja -y

    - name: Setup vcpkg (manifest mode)
      uses: lukka/run-vcpkg@v11
      with:
        vcpkgJsonGlob: vcpkg.json

    - name: Compile PvZ-Portable for Windows (MSVC)
      shell: pwsh
      run: |
        cmake -G "Ninja" -B build -DCMAKE_BUILD_TYPE=Release -DCONSOLE=OFF -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" -DVCPKG_TARGET_TRIPLET=x64-windows-static
        cmake --build build
        New-Item -ItemType Directory -Force -Path dist | Out-Null
        Copy-Item build/pvz-portable.exe dist/pvz-portable-ru-hd.exe

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: pvz-portable-windows-ru
        path: dist/
